name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads global.json, so CI builds with the exact SDK pinned for
      # local development — no separate version to keep in sync by hand.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Release, not Debug: Directory.Build.props only turns on
      # TreatWarningsAsErrors for Release, the same reasoning the client
      # repo uses for keeping `flutter analyze` a deliberate separate
      # step rather than baked into every build.
      - name: Build
        run: dotnet build --no-restore -c Release

      # No Docker setup step needed: GitHub's ubuntu-latest runners ship
      # with Docker preinstalled, which is all Testcontainers.PostgreSql
      # needs to spin up a real Postgres per integration test.
      - name: Test
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

  # Runs only for a push that landed on main (never for PRs) and only after
  # build-and-test passes — so a merge is what ships, not what merely built.
  # This is deliberately just an app deploy: build the image, push it, point
  # the existing Container App at it. Infrastructure changes (new resources,
  # SKU changes, the DB password) are a separate, manually-triggered
  # workflow — see infra.yaml — so that a routine code change can never
  # accidentally touch the database or its credentials.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ACR_LOGIN_SERVER: ledgersyncacr2026.azurecr.io
      RESOURCE_GROUP: ledger-sync-server-rg
      CONTAINER_APP: ledger-sync-api
    steps:
      - uses: actions/checkout@v7

      # OIDC federated login — no client secret to store or rotate. See
      # infra/README.md for how the app registration and its GitHub trust
      # relationship were set up.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image
        run: docker build -t $ACR_LOGIN_SERVER/ledger-sync-api:${{ github.sha }} -t $ACR_LOGIN_SERVER/ledger-sync-api:latest .

      # Uses the OIDC-derived Azure session to fetch an ACR token — no
      # separate registry credential needed, just the AcrPush role granted
      # to the service principal.
      - name: Push image to ACR
        run: |
          az acr login --name ledgersyncacr2026
          docker push $ACR_LOGIN_SERVER/ledger-sync-api:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/ledger-sync-api:latest

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_LOGIN_SERVER/ledger-sync-api:${{ github.sha }}
