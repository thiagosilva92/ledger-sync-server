name: Infra

# Deliberately NOT triggered on push — infrastructure changes (new
# resources, SKU changes, the database password) are rare and reviewed by
# a human, unlike app deploys (see the `deploy` job in ci.yaml) which run
# on every merge to main. Run this from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the changes (unchecked = what-if preview only, applies nothing)"
        type: boolean
        default: false

jobs:
  infra:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (preview only, changes nothing)
        run: |
          az deployment group what-if \
            --resource-group ledger-sync-server-rg \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
            --parameters apiKeyHash='${{ secrets.API_KEY_HASH_0 }}'

      - name: Apply
        if: ${{ inputs.apply }}
        run: |
          az deployment group create \
            --resource-group ledger-sync-server-rg \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
            --parameters apiKeyHash='${{ secrets.API_KEY_HASH_0 }}'
