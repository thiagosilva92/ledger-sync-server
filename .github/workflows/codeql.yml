name: CodeQL

# Runs independently of ci.yaml: on every push/PR to main (catches a new
# vulnerable pattern introduced by a change) and on a weekly schedule
# (catches a newly-disclosed vulnerability in code that hasn't changed).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Monday, off-peak, arbitrary minute to avoid the
      # top-of-hour thundering herd every other repo's "0 0 * * 0" hits.

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # Manual build (not autobuild or build-mode: none): this is a
          # multi-project solution with Central Package Management, and an
          # explicit build mirroring ci.yaml's own restore/build steps is
          # more reliable than CodeQL guessing how to build it.
          build-mode: manual

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
