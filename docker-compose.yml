x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    ConnectionStrings__SyncDatabase: >-
      Host=postgres;Database=ledger_sync;Username=postgres;Password=postgres
    # Hash of "demo-local-only-key" — see README's Authentication section.
    # Fine to commit for a local demo; a real deployment would inject
    # this the way any other secret is injected (environment variable
    # from a secret store, not a value baked into a committed compose
    # file).
    ApiKeys__Hashes__0: 59b69b7c26135a56dda94467422ea4910356e0271b520f85f2c77ede5e55f0dc
    # Four more demo keys ("loadtest-device-N-key", N = 1..4), same
    # commit-is-fine reasoning as __0 — used by
    # tests/Ledger.SyncServer.LoadTests' throughput scenario to simulate
    # several independent devices rather than one key alone.
    ApiKeys__Hashes__1: b71f9be61299cb8c723c65bb105c645346f1253fec66cac03373ab3261ffc3c7
    ApiKeys__Hashes__2: e95298781ad2286160aa2e37881469017e740dc1c32a09b36c2eb92ac7d1a504
    ApiKeys__Hashes__3: 94c0c01f8b12add1a2fded7d377c94d6ed1886cd2147caf86639be43419d9e9d
    ApiKeys__Hashes__4: 43a0b82c3caf1fe5a865fb5292d127b19959deadc7d1c39ea3be8ec64f67044c
    # Overridable so the load test's two scenarios can each ask for what
    # they actually need: the default (100/60s) to prove the limiter
    # holds under real concurrent traffic, or a deliberately high ceiling
    # to measure raw throughput without the limiter being what's
    # actually being measured. Plain `docker compose up` keeps the
    # production-matching default.
    RateLimiting__PermitLimit: ${RATE_LIMIT_PERMIT:-100}
    RateLimiting__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    Observability__OtlpEndpoint: http://jaeger:4317
  depends_on:
    migrator:
      condition: service_completed_successfully
    jaeger:
      condition: service_started

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledger_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Postgres 18's official image changed convention: it now expects a
      # single mount at the parent directory and manages its own
      # version-specific subdirectory underneath, rather than a volume
      # mounted directly at .../data — found by actually running this
      # compose file, not by reading the Postgres 18 changelog in advance.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs the committed EF Core migration once, then exits — see
  # Program.cs's "--migrate-only" branch for why this is a separate step
  # rather than every replica migrating on its own startup.
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__SyncDatabase: >-
        Host=postgres;Database=ledger_sync;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Two explicitly-named replicas, not `deploy.replicas`/`--scale` — YARP's
  # cluster below needs fixed, known hostnames to route to, and two named
  # services reading identically from the `&api` anchor makes that
  # explicit and readable instead of relying on Docker's own DNS-level
  # round-robin across anonymously-scaled containers.
  api1:
    <<: *api

  api2:
    <<: *api

  # The one port exposed to the host. Clients never talk to api1/api2
  # directly — only through here, round-robined, with api-cluster's
  # active health check (see Ledger.SyncServer.Gateway/appsettings.json)
  # polling each replica's own /health/ready and pulling a replica out of
  # rotation the moment its Postgres connection dies.
  gateway:
    build:
      context: .
      dockerfile: src/Ledger.SyncServer.Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Observability__OtlpEndpoint: http://jaeger:4317
    depends_on:
      - api1
      - api2
      - jaeger

  # All-in-one Jaeger: OTLP receiver + storage + UI in one container —
  # the local-demo equivalent of the OTel Collector + real backend a
  # production deployment would run instead. UI on :16686; every service
  # above exports traces to it on :4317 (OTLP/gRPC).
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"

volumes:
  postgres-data:
